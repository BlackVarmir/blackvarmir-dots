# Меню ISO BlackVarmir Arch (UEFI, GRUB). Тема й шрифт копіюються сюди скриптом iso/build.sh.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod png

set gfxmode=auto
set gfxpayload=keep

if loadfont "${prefix}/themes/blackvarmir/font.pf2" ; then
    true
elif loadfont "${prefix}/fonts/unicode.pf2" ; then
    true
fi
terminal_output gfxterm

if [ -f "${prefix}/themes/blackvarmir/theme.txt" ]; then
    set theme="${prefix}/themes/blackvarmir/theme.txt"
else
    set menu_color_normal=light-gray/black
    set menu_color_highlight=black/light-green
fi

set default=install
set timeout=10
set timeout_style=menu

menuentry "Install BlackVarmir Arch" --id install --class arch --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bv.mode=install quiet
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Try without installing" --id try --class arch --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bv.mode=try quiet
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Safe graphics mode (nomodeset)" --id safe --class arch --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bv.mode=install nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f "/boot/memtest86+/memtest86x64.efi" ]; then
        menuentry "Memory test" --class memtest {
            linux /boot/memtest86+/memtest86x64.efi
        }
    fi
    menuentry "UEFI firmware settings" --id uefi-firmware {
        fwsetup
    }
fi

menuentry "Restart" --class restart {
    reboot
}
menuentry "Shut down" --class shutdown {
    halt
}
