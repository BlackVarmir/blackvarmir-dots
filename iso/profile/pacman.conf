# pacman для збирання ISO (не потрапляє в установлену систему)
[options]
HoldPkg      = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Пакети з AUR (ttf-geist, bibata-cursor-theme-bin): їх збирає iso/build.sh.
# Шлях підставляється скриптом збирання.
[blackvarmir-local]
SigLevel = Optional TrustAll
Server = file://@LOCALREPO@
