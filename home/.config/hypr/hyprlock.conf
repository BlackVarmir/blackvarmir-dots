# Екран блокування у стилі Varmir Dark Glass.
# https://wiki.hypr.land/hypr-ecosystem/hyprlock/
# Живий розмитий стіл під ним вмикають session_lock_xray і session_lock_blur у modules/look.lua.

general {
    hide_cursor = true
    ignore_empty_input = true
    compositor_fade = true
}

animations {
    enabled = true
    bezier = varmir, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, varmir
    animation = fadeOut, 1, 2, varmir
}

background {
    monitor =
    path =
    color = rgba(7, 7, 8, 0.45)
}

# Дата (моноширинна «брова» Varmir)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=uk_UA.UTF-8 date +"%A · %-d %B"
    color = rgba(16, 185, 129, 1.0)
    font_size = 13
    font_family = Geist Mono
    position = 0, 330
    halign = center
    valign = center
}

# Годинник
label {
    monitor =
    text = $TIME
    color = rgba(250, 250, 250, 1.0)
    font_size = 150
    font_family = Geist SemiBold
    position = 0, 210
    halign = center
    valign = center
}

# Ім'я користувача
label {
    monitor =
    text = $DESC
    color = rgba(250, 250, 250, 1.0)
    font_size = 18
    font_family = Geist SemiBold
    position = 0, -40
    halign = center
    valign = center
}

# Поле пароля
input-field {
    monitor =
    size = 340, 48
    outline_thickness = 1
    rounding = -1
    inner_color = rgba(17, 17, 19, 0.6)
    outer_color = rgba(10b981ff) rgba(22d3eeff) 45deg
    check_color = rgba(22d3eeff)
    fail_color = rgba(ef4444ff)
    font_color = rgba(250, 250, 250, 1.0)
    font_family = Geist
    placeholder_text = <span foreground="##71717a">Пароль</span>
    fail_text = <span foreground="##ef4444">Невірний пароль · $ATTEMPTS</span>
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

# Розкладка клавіатури
label {
    monitor =
    text = $LAYOUT[EN,UK]
    color = rgba(161, 161, 170, 1.0)
    font_size = 11
    font_family = Geist Mono
    position = 0, 40
    halign = center
    valign = bottom
}
