# Бездіяльність: блокування, вимкнення екрана, сон.
# https://wiki.hypr.land/hypr-ecosystem/hypridle/
# (hypridle поки що використовує формат hyprlang, не Lua)

general {
    # Екран блокування оболонки; якщо Quickshell не запущений — hyprlock
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
    # Не засинати, доки екран справді не заблоковано
    inhibit_sleep = 3
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2.5 хв: приглушити підсвітку
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 хв: заблокувати
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 хв: вимкнути екран
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 20 хв: сон
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
