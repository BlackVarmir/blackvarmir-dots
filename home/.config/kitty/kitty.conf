# kitty · Varmir Dark
# https://sw.kovidgoyal.net/kitty/conf/

font_family      GeistMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0
disable_ligatures never

# Вікно
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.96
enable_audio_bell no

# Швидкість: GPU-рендеринг з мінімальною затримкою вводу
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Курсор
cursor_shape beam
cursor_blink_interval 0.6
cursor #10b981
cursor_text_color #04130d

# Кольори Varmir
foreground #fafafa
background #0a0a0b
selection_foreground #04130d
selection_background #34d399
url_color #22d3ee

# чорний
color0  #18181b
color8  #52525b
# червоний
color1  #ef4444
color9  #f87171
# зелений
color2  #10b981
color10 #34d399
# жовтий
color3  #f59e0b
color11 #fbbf24
# синій
color4  #38bdf8
color12 #7dd3fc
# пурпурний
color5  #a78bfa
color13 #c4b5fd
# ціан
color6  #22d3ee
color14 #67e8f9
# білий
color7  #a1a1aa
color15 #fafafa

# Вкладки
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #10b981
active_tab_foreground #04130d
inactive_tab_background #18181b
inactive_tab_foreground #a1a1aa
