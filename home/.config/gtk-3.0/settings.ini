# GTK 3: темна тема adw-gtk3 у кольорах Varmir (кольори — у gtk.css поруч).
# Ті самі значення install.sh записує в gsettings: їх читають застосунки під Wayland.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Geist 11
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
# Лише кнопка «закрити»: згортати й розгортати — справа Hyprland
gtk-decoration-layout=:close
